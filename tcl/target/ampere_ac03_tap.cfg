set _CHIPNAME s

set _SYSTAPNAME sys
set _DFTTAPNAME dft

set SYSTAPID_AC03 0x3BA06477
set SYSTAPID_AC04 0x4BA06477

set DFTTAPID_AC03_A0 0x03100A2D
set DFTTAPID_AC03_B0 0x13100A2D
set DFTTAPID_AC04_A0 0x04100A2D
set DFTTAPID_AC04_1_A0 0x04101A2D

if { [info exists AMPERE_SOCKETMAX] } {
	set _AMPERE_SOCKETMAX $AMPERE_SOCKETMAX
	set socket_num [expr {$_AMPERE_SOCKETMAX - 1}]
} else {
	set _AMPERE_SOCKETMAX 1
	set socket_num 0
}

for {set socket_idx 0} {$socket_idx < $_AMPERE_SOCKETMAX} {incr socket_idx} {
	if { [info exists DFTTAPID] } {
		jtag newtap ${_CHIPNAME}${socket_num} ${_DFTTAPNAME}.tap -irlen 8 -ircapture 0x1 -irmask 0x3 \
		-expected-id $DFTTAPID
	} else {
		jtag newtap ${_CHIPNAME}${socket_num} ${_DFTTAPNAME}.tap -irlen 8 -ircapture 0x1 -irmask 0x3 \
		-expected-id $DFTTAPID_AC03_A0 \
		-expected-id $DFTTAPID_AC03_B0 \
		-expected-id $DFTTAPID_AC04_A0 \
		-expected-id $DFTTAPID_AC04_1_A0
	}

	if { [info exists SYSTAPID] } {
		jtag newtap ${_CHIPNAME}${socket_num} ${_SYSTAPNAME}.tap -irlen 4 -ircapture 0x1 -irmask 0x3 \
		-expected-id $SYSTAPID
	} else {
		jtag newtap ${_CHIPNAME}${socket_num} ${_SYSTAPNAME}.tap -irlen 4 -ircapture 0x1 -irmask 0x3 \
		-expected-id $SYSTAPID_AC03 \
		-expected-id $SYSTAPID_AC04
	}

	incr socket_num -1
}

#
# Initialize the JTAG chain for the defined TAPs
# Detect chip idcode
#

set result [capture {jtag init}]
set dft_tap_start [string first ${_CHIPNAME}0.${_DFTTAPNAME}.tap $result]
set sys_tap_start [string first ${_CHIPNAME}0.${_SYSTAPNAME}.tap $result]

if { $dft_tap_start >= 0 } {
	set dft_tap_string [string range $result $dft_tap_start end]
	lassign $dft_tap_string c0 c1 c2 dft_tap_idcode
	set dft_tap_idcode [expr {$dft_tap_idcode}]
	echo "IDCODE found: $dft_tap_idcode"
} else {
	set dft_tap_idcode 0x00000000
}

if { $sys_tap_start >= 0 } {
	set sys_tap_string [string range $result $sys_tap_start end]
	lassign $sys_tap_string c0 c1 c2 sys_tap_idcode
	set sys_tap_idcode [expr {$sys_tap_idcode}]
	echo "IDCODE found: $sys_tap_idcode"
} else {
	set sys_tap_idcode 0x00000000
}

if { $dft_tap_idcode == $DFTTAPID_AC03_A0 } {
	set AMPERE_CHIP ac03
	set AMPERE_REV A0
} elseif { $dft_tap_idcode == $DFTTAPID_AC03_B0 } {
	set AMPERE_CHIP ac03
	set AMPERE_REV B0
} elseif { $dft_tap_idcode == $DFTTAPID_AC04_A0 } {
	set AMPERE_CHIP ac04
	set AMPERE_REV A0
} elseif { $dft_tap_idcode == $DFTTAPID_AC04_1_A0 } {
	set AMPERE_CHIP ac04_1
	set AMPERE_REV A0
} else {
	set AMPERE_CHIP unknown
	set AMPERE_REV unknown
}

if { ![info exists AMPERE_PLATFORM] } {
	set AMPERE_PLATFORM unknown
}
